# Template Apache — sisipkan ke vhost portal websitepsimkg
# SEBELUM catch-all ProxyPass / ke 127.0.0.1:3001
# (disarankan setelah blok /monas)
#
# Setelah edit:
#   sudo apache2ctl configtest
#   sudo systemctl reload apache2

# === Verifikasi InaNWP (METplus / GSMAP) ===

# API backend — rule lebih spesifik, HARUS di atas rule frontend
ProxyPass        /verifikasi-inanwp/api http://127.0.0.1:8018/api
ProxyPassReverse /verifikasi-inanwp/api http://127.0.0.1:8018/api

# Frontend static (server-static.js di :3018, BASE_PATH=/verifikasi-inanwp)
ProxyPass        /verifikasi-inanwp     http://127.0.0.1:3018/verifikasi-inanwp
ProxyPassReverse /verifikasi-inanwp     http://127.0.0.1:3018/verifikasi-inanwp

RewriteRule ^/verifikasi-inanwp$ /verifikasi-inanwp/ [R=301,L]

# === end Verifikasi InaNWP ===

# (existing portal catch-all — JANGAN UBAH)

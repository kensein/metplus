# METplus Use Case: Verifikasi Presipitasi INanWP vs GSMAP
# Referensi: https://metplus.readthedocs.io/en/latest/generated/model_applications/precipitation/
#
# Jalankan:
#   run_metplus.py config/inanwp_gsmap.conf config/inanwp_system.conf

[config]

###
# Processes to run
###
PROCESS_LIST = RegridDataPlane, GridStat

###
# Time Info - loop by valid time (GSMAP hourly/daily)
###
LOOP_BY = VALID
VALID_TIME_FMT = %Y%m%d%H
VALID_BEG = 2026072700
VALID_END = 2026073023
VALID_INCREMENT = 3600

# Lead time 0 karena forecast di-evaluasi per valid time
LEAD_SEQ = 0

###
# File I/O
###

# --- Forecast: INanWP (NetCDF post-processed / asim) ---
FCST_GRID_STAT_INPUT_DIR = {FCST_DIR}
FCST_GRID_STAT_INPUT_TEMPLATE = {valid?fmt=%Y%m%d%H}-d01-asim.nc

# --- Observation: GSMAP NRT (regrid ke grid model) ---
OBS_REGRID_DATA_PLANE_RUN = True
OBS_REGRID_DATA_PLANE_INPUT_DIR = {OBS_DIR}
OBS_REGRID_DATA_PLANE_INPUT_TEMPLATE = gsmap_{valid?fmt=%Y%m%d%H}.nc

OBS_REGRID_DATA_PLANE_OUTPUT_DIR = {OUTPUT_BASE}/gsmap_regrid
OBS_REGRID_DATA_PLANE_OUTPUT_TEMPLATE = gsmap_regrid_{valid?fmt=%Y%m%d%H}.nc

OBS_GRID_STAT_INPUT_DIR = {OBS_REGRID_DATA_PLANE_OUTPUT_DIR}
OBS_GRID_STAT_INPUT_TEMPLATE = {OBS_REGRID_DATA_PLANE_OUTPUT_TEMPLATE}

GRID_STAT_OUTPUT_DIR = {OUTPUT_BASE}/gridstat
GRID_STAT_OUTPUT_TEMPLATE = {valid?fmt=%Y%m%d%H}

###
# Field Info
###
MODEL = INANWP
OBTYPE = GSMAP

# Forecast variable - sesuaikan setelah inspect_nc.py
# Default: RAINNC (WRF accumulated precipitation) atau APCP
FCST_VAR1_NAME = RAINNC
FCST_VAR1_LEVELS = "(*,*)"
FCST_VAR1_THRESH = gt0.1, gt1, gt5, gt10, gt20, gt50

# Observation variable - GSMAP NRT
OBS_VAR1_NAME = hourlyPrecipRateGC
OBS_VAR1_LEVELS = "(*,*)"
OBS_VAR1_THRESH = gt0.1, gt1, gt5, gt10, gt20, gt50

# Regrid GSMAP ke grid forecast
OBS_REGRID_DATA_PLANE_VAR1_INPUT_FIELD_NAME = hourlyPrecipRateGC
OBS_REGRID_DATA_PLANE_VAR1_INPUT_LEVEL = "({valid?fmt=%Y%m%d_%H%M%S},*,*)"
OBS_REGRID_DATA_PLANE_VAR1_OUTPUT_FIELD_NAME = hourlyPrecipRateGC

###
# RegridDataPlane Settings
###
REGRID_DATA_PLANE_METHOD = BUDGET
REGRID_DATA_PLANE_WIDTH = 2
REGRID_DATA_PLANE_VERIF_GRID = {FCST_DIR}/{valid?fmt=%Y%m%d%H}-d01-asim.nc

###
# GridStat Settings
###
GRID_STAT_REGRID_TO_GRID = OBS

GRID_STAT_NEIGHBORHOOD_WIDTH = 3, 5, 9
GRID_STAT_NEIGHBORHOOD_SHAPE = SQUARE
GRID_STAT_NEIGHBORHOOD_COV_THRESH = >=0.5

GRID_STAT_OUTPUT_FLAG_CTC = STAT
GRID_STAT_OUTPUT_FLAG_CTS = STAT
GRID_STAT_OUTPUT_FLAG_CNT = STAT
GRID_STAT_OUTPUT_FLAG_SL1L2 = STAT
GRID_STAT_OUTPUT_FLAG_NBRCTC = STAT
GRID_STAT_OUTPUT_FLAG_NBRCTS = STAT
GRID_STAT_OUTPUT_FLAG_NBRCNT = STAT

GRID_STAT_NC_PAIRS_FLAG_LATLON = TRUE
GRID_STAT_NC_PAIRS_FLAG_RAW = TRUE
GRID_STAT_NC_PAIRS_FLAG_DIFF = TRUE
GRID_STAT_NC_PAIRS_FLAG_CLIMO = FALSE
GRID_STAT_NC_PAIRS_FLAG_APPLY_MASK = FALSE
GRID_STAT_NC_PAIRS_FLAG_DISTANCE_MAP = FALSE
